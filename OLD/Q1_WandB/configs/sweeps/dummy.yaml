# Sweep: the dummy baseline (DummyRegressor). The score any real model has to beat.
# entrypoints/sweep.py merges this file over the "sweep" section of configs/base.yaml.
#
# The dummy ignores the features and always predicts one number: the mean or the median target of its
# training rows. Two strategies, so this grid is 2 runs. mean is listed first, which makes it the baseline
# the median run is compared with.
#
# data_missing and scaler cannot change what a dummy predicts from, but every run's config must carry them
# (REQUIRED_KEYS in src/config.py). drop gives it the same training rows as the plain closed form run.

name: dummy                           # shown in the Sweeps tab
method: grid
parameters:
  model_kind:
    value: dummy
  dummy_strategy:                     # a dummy only key (MODEL_KEYS in src/config.py)
    values: [mean, median]
  data_missing:
    value: drop
  scaler:
    value: none
