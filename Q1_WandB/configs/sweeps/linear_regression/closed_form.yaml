# Sweep: closed form linear regression (LinearRegression) across preprocessing choices.
# entrypoints/sweep.py merges this file over the "sweep" section of configs/base.yaml.
#
#   value:   one fixed setting, the same in every run
#   values:  settings to try. A grid runs every combination, here 1 x 3 x 3 = 9 runs
#
# The FIRST value of each list defines the baseline run that every other run is compared with
# (entrypoints/compare.py), so list the plainest option first.
#
# To add an option: add a key under parameters, add it to REQUIRED_KEYS in src/config.py, and read it in
# src/. Each new key multiplies the number of runs.

name: linear-regression-closed-form   # shown in the Sweeps tab
method: grid                          # try every combination. W&B also offers random and bayes
parameters:
  model_kind:
    value: closed_form
  # rows with a missing value: drop them, or keep them and fill the gaps with the column median or mean.
  # One key instead of two (drop/keep and median/mean), because a grid cannot skip combinations and
  # "drop" has nothing to impute
  data_missing:
    values: [drop, impute_median, impute_mean]
  scaler:                             # none leaves the features as they are
    values: [none, standard, minmax]
